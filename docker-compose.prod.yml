# PMS — Talbotiq · PRODUCTION posture (CONFIG only — provisions nothing).
#
# Differences from the dev stack (docker-compose.yml) that make this prod-ready
# at the CODE/CONFIG level:
#   * runs under config.settings.prod (DEBUG off, HSTS, secure cookies, fail-closed
#     secrets — see config/settings/prod.py);
#   * the code is BAKED into the image (INSTALL_DEV=false, NO `.:/app` source
#     mount), so a container runs exactly what was built;
#   * CONTROLLED MIGRATIONS: a one-shot `migrate` service runs migrations ONCE;
#     the web/worker containers do NOT auto-migrate (no N-replica migrate race).
#     Deploy order: `migrate` to completion, then roll web. See docs/RUNBOOK.md;
#   * the cache Redis is a SEPARATE instance from the broker Redis (allkeys-lru
#     vs noeviction) so cache churn can never evict queued jobs;
#   * required secrets use `${VAR:?...}` — compose REFUSES to start if unset
#     (fail-closed; secrets come from the environment / a vault, never a file).
#
# A real deploy points DB_HOST / the Redis URLs at managed services and drops the
# mysql/redis-* services here (they are included for a self-contained reference).
#
#   docker compose -f docker-compose.prod.yml run --rm migrate   # once
#   docker compose -f docker-compose.prod.yml up -d               # roll web/workers

x-app-environment: &app_environment
  DJANGO_SETTINGS_MODULE: config.settings.prod
  # Fail-closed: these MUST be supplied (no insecure defaults).
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set a long random production secret}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?comma-separated prod hostnames}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  # REQUIRED (C4): every password-reset and invitation link is built from this.
  # Its base default is http://localhost:8080, which does not fail — it SENDS, and
  # every recovery email goes out with a dead link to the recipient's own machine.
  # On a bare IP today this is http://<IP> (Caddy publishes :80); it becomes
  # https://<domain> the moment DNS exists (see docs/BUILD/ENABLE_TLS.md).
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?the public base URL of the SPA, e.g. http://34.1.2.3 or https://pms.acme.com — password-reset links are built from it}
  # THE transport switch. Empty = no DNS name yet, so no certificate is possible
  # and the stack runs HTTP-only. Set it and Caddy obtains a certificate while
  # prod.py turns on the HTTPS redirect, Secure cookies and HSTS together — one
  # variable, both halves. `check --deploy` warns (pms.W003) the whole time it is
  # empty, so HTTP-only stays a decision rather than an oversight.
  # Full steps: docs/BUILD/ENABLE_TLS.md.
  DOMAIN: ${DOMAIN:-}
  # Overrides for the odd topology (TLS terminated at a load balancer, say).
  # LEAVE THESE EMPTY unless you mean it: empty means "follow DOMAIN", which is
  # right in both modes. prod.py treats empty as not-overridden.
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-}
  DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-}
  DB_NAME: ${DB_NAME:-pms}
  DB_USER: ${DB_USER:-pms}
  DB_PASSWORD: ${DB_PASSWORD:?set the database password}
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  # Optional read replica (BUILD_3): set DB_REPLICA_HOST to route reads there.
  DB_REPLICA_HOST: ${DB_REPLICA_HOST:-}
  # Cache + sessions on the SEPARATE cache Redis (allkeys-lru); broker on its own.
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis-cache:6379/1}
  REDIS_SESSION_URL: ${REDIS_SESSION_URL:-redis://redis-cache:6379/2}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis-broker:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis-broker:6379/0}
  # Uploaded media (C9). With USE_GCS_MEDIA=true this is unused and files go to
  # the bucket; with it false they land on the named volume mounted below, so the
  # fallback is durable rather than merely being the default.
  MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
  USE_GCS_MEDIA: ${USE_GCS_MEDIA:-false}
  GS_BUCKET_NAME: ${GS_BUCKET_NAME:-}
  # Unset on GCP means Application Default Credentials (the VM's attached service
  # account) — better than a key file, which has to be shipped, stored and rotated.
  GS_CREDENTIALS_FILE: ${GS_CREDENTIALS_FILE:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  # AI: the key is injected from the environment / vault — never written here.
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-apps.ai.groq.GroqProvider}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  LLM_MAX_CALLS: ${LLM_MAX_CALLS:-0}
  # See docker-compose.yml: 900 truncates a long-form draft mid-JSON.
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}

# Baked production image: code COPYed in, NO dev/test toolchain, NO source mount.
x-app-build: &app_build
  build:
    context: .
    args:
      INSTALL_DEV: "false"
  image: pms-talbotiq:prod

services:
  # ── public edge (the ONLY container that binds a public port) ──────────────
  # With DOMAIN set: obtains and renews a Let's Encrypt certificate automatically
  # and redirects http -> https. DOMAIN must already resolve to this host, and :80
  # must be reachable from the internet — the HTTP-01 challenge is answered on it,
  # so closing :80 breaks renewal ~60 days later, not today.
  #
  # With DOMAIN empty: serves plain HTTP on :80 for any Host and attempts no ACME,
  # because Let's Encrypt cannot issue a certificate for a bare IP. 443 stays
  # published so that switching DOMAIN on needs no compose edit and no downtime
  # beyond the restart. See ./Caddyfile and docs/BUILD/ENABLE_TLS.md.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Optional to Caddy, but set it with DOMAIN: it is the only warning you get
      # before a failed renewal becomes an outage.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # KEEP caddy_data: it holds the issued certificates and the ACME account key.
      # Losing it forces re-issue, and Let's Encrypt allows only 5 duplicate
      # certificates per week — lose it twice in a week and the site is HTTP-only
      # until the window rolls.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend
    restart: unless-stopped

  # ── the built SPA (internal only; Caddy is the public door) ────────────────
  frontend:
    build:
      # Repo-root context: the SPA imports the sibling shared/ via the @shared
      # alias, and a ./frontend context omits it (see frontend/Dockerfile).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: /api
    expose:
      - "80"
    restart: unless-stopped

  # ── one-shot migration (the SINGLE place migrations run in prod) ────────────
  # deploy_migrate (E2) wraps `migrate` in a MySQL advisory lock: even if this job
  # is ever run more than once concurrently, only one session migrates; the rest
  # exit 0 as a no-op. Idempotent. Workers/web boot WITHOUT migrating (below).
  migrate:
    <<: *app_build
    command: python manage.py deploy_migrate
    environment: *app_environment
    restart: "no"
    # Dropped privileges — see the note on `web`.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    <<: *app_build
    # gunicorn ONLY — NO migrate here (the migrate service owns that), so N web
    # replicas never race on schema. Tuned by gunicorn.conf.py.
    command: gunicorn config.wsgi:application -c gunicorn.conf.py
    environment: *app_environment
    # Avatars died on every container replacement before this: MEDIA_ROOT pointed
    # inside the container with nothing behind it, and the failure was silent —
    # the photo endpoint just 404s and the UI falls back to initials.
    volumes:
      - media_data:/app/media
    # Dropped privileges (C2). The image already runs as UID 10001; these stop
    # the container regaining anything from inside:
    #   no-new-privileges  a setuid binary cannot escalate back to root
    #   cap_drop: ALL      no capabilities at all — this is a Python web process,
    #                      it binds a high port and needs none of them
    # read_only is deliberately NOT set: gunicorn writes its heartbeat to
    # /dev/shm, Python may write __pycache__, and MEDIA_ROOT is written on every
    # avatar upload. Turning it on needs tmpfs mounts for at least /tmp and
    # /dev/shm plus PYTHONDONTWRITEBYTECODE (already set) — worth doing, but not
    # worth doing blind at the same time as everything else.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-worker:
    <<: *app_build
    command: celery -A config worker -l info
    environment: *app_environment
    # The worker writes media too (AI-generated exports, future attachments).
    volumes:
      - media_data:/app/media
    # Dropped privileges — see the note on `web`.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  celery-beat:
    <<: *app_build
    command: celery -A config beat -l info
    environment: *app_environment
    # Dropped privileges — see the note on `web`.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── reference data services (a real deploy uses managed MySQL/Redis) ────────
  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=caching_sha2_password
      --log-bin-trust-function-creators=1
      --max-connections=${DB_MAX_CONNECTIONS:-200}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set the mysql root password}
      MYSQL_DATABASE: ${DB_NAME:-pms}
      MYSQL_USER: ${DB_USER:-pms}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set the database password}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  # Broker Redis — noeviction (a dropped queued job is data loss).
  redis-broker:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped

  # Cache + sessions Redis — allkeys-lru (safe to evict; can't starve the broker).
  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

volumes:
  mysql_data:
  # Uploaded avatars when USE_GCS_MEDIA is false. Treat as DATA: backing it up is
  # a separate job from the database dump (see docs/BUILD/BACKUP_RESTORE.md).
  media_data:
  # Issued certificates + the ACME account key. Treat as state, not cache.
  caddy_data:
  caddy_config:
