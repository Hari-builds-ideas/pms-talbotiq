# PMS — Talbotiq · local/dev stack (LOCKED to the approved tech stack).
# Services: web (Django+DRF), mysql8, redis7, celery-worker, celery-beat.
# Redis is the ONLY broker/result backend — no Kafka in MVP.
#
#   docker compose up -d --build         # bring the stack up
#   docker compose run --rm web pytest   # run the full test suite (MySQL-backed)
#   docker compose run --rm web python manage.py migrate

# Shared environment for every app container (web + celery), via YAML anchor.
x-app-environment: &app_environment
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
  DB_NAME: ${DB_NAME:-pms}
  DB_USER: ${DB_USER:-pms}
  DB_PASSWORD: ${DB_PASSWORD:-pmspw}
  DB_HOST: mysql
  DB_PORT: "3306"
  # Broker+results on /0 (noeviction). Cache /1 + sessions /2 share this Redis
  # for MVP, but they are addressed by their OWN env URLs — in production point
  # REDIS_CACHE_URL / REDIS_SESSION_URL at a SEPARATE Redis (allkeys-lru) with no
  # code change, so cache churn can never evict broker jobs. See BUILD_NOTES.
  REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
  REDIS_SESSION_URL: ${REDIS_SESSION_URL:-redis://redis:6379/2}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-dev}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  # Bearer token for the Prometheus /metrics endpoint (unset → /metrics is 404).
  METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}
  # ── AI / LLM provider. Keys come from the gitignored .env via compose
  # interpolation — NEVER written into this file. Active provider is OpenAI; with
  # OPENAI_API_KEY present the agents run on OpenAI, unset → unconfigured → 503.
  # Switch back to Groq by config: set LLM_PROVIDER=apps.ai.groq.GroqProvider in .env
  # (GROQ_API_KEY + the Groq model names are still honoured).
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-apps.ai.openai_provider.OpenAIProvider}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  # Run-wide global call ceiling (cache-counted, deployment-wide). OpenAI is PAID — keep
  # this ON. 500 is a dev/QA backstop; size to tenant count (or 0 to disable) for prod.
  LLM_MAX_CALLS: ${LLM_MAX_CALLS:-500}
  # Must match the settings default (4096). 900 truncates a Gemini "thinking" model
  # mid-JSON — Agent-1 review drafts failed 100% of the time with PROVIDER_ERROR while
  # this pin quietly overrode the fix already made in config/settings/base.py.
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc-demo}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Demo OIDC}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-demo-client-id}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-demo-secret}
  OIDC_SERVER_URL: ${OIDC_SERVER_URL:-https://oidc.example.com}
  OIDC_DEFAULT_TENANT_SLUG: ${OIDC_DEFAULT_TENANT_SLUG:-}

x-app-build: &app_build
  build:
    context: .
    args:
      INSTALL_DEV: "true"

services:
  mysql:
    image: mysql:8.0
    # log-bin-trust-function-creators lets a non-SUPER user create the audit-log
    # immutability TRIGGERS (migration audit/0002) while binary logging is on.
    # In a managed prod DB, set this server var (or grant TRIGGER+SUPER) before
    # running migrations — see docs/BUILD_NOTES.md.
    command: >
      --default-authentication-plugin=caching_sha2_password
      --log-bin-trust-function-creators=1
      --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${DB_NAME:-pms}
      MYSQL_USER: ${DB_USER:-pms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pmspw}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Host port 3307 (container 3306) to avoid clashing with a local MySQL.
    # Inter-container traffic uses the service name + internal port regardless.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    # noeviction (the default policy, set explicitly) so that under memory
    # pressure Redis rejects writes rather than evicting keys. This is REQUIRED
    # for the Celery broker DB (/0): evicting a queued task = a silently dropped
    # job. The cache DB (/1) shares this instance for MVP; its entries are TTL'd
    # and tolerate write failures. In production, run a SEPARATE Redis (or an
    # allkeys-lru instance) for the cache so cache churn never starves the broker.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    <<: *app_build
    # Auto-migrate then serve (one-command stack: the DB is always current on up).
    # The web tier is stateless: no host port, fronted by the frontend edge nginx,
    # scale with `--scale web=N`.
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application -c gunicorn.conf.py"
    environment: *app_environment
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # The PUBLIC entrypoint: serves the built React SPA and reverse-proxies the
    # Django-served paths (/api, /admin, /accounts, /static, /healthz, /readyz)
    # to the web tier (see frontend/nginx.conf). Built against the REAL API.
    build:
      # Repo-root context so the sibling shared/ layer (consumed via @shared ->
      # ../shared/src) is available to the build; ./frontend alone omitted it and
      # broke `tsc` (see frontend/Dockerfile).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: /api
    ports:
      # Serve the SPA at :8090 — the URL used by the README, all docs, and the
      # scripts (demo_ready.sh / qa_handover.sh default BASE). `docker compose up`
      # alone now brings the whole app up here; no manual helper container needed.
      - "8090:80"
    depends_on:
      - web

  celery-worker:
    <<: *app_build
    command: celery -A config worker -l info
    environment: *app_environment
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    <<: *app_build
    command: celery -A config beat -l info
    environment: *app_environment
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    <<: *app_build
    # Celery monitoring dashboard on the existing broker. Basic-auth is REQUIRED
    # (never unauthenticated) — credentials from FLOWER_BASIC_AUTH ("user:pass").
    command: >
      celery -A config flower
      --port=5555
      --basic-auth=${FLOWER_BASIC_AUTH:-admin:flowerpass}
    environment: *app_environment
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
