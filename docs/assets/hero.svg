<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="TalbotIQ PMS — AI proposes, a human always approves">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee8c5"/>
      <stop offset="100%" stop-color="#5b9dff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3ee8c5"/>
    </marker>
    <style>
      .title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #e8edf5; letter-spacing: -0.02em; }
      .subtitle { font: 500 13px system-ui, -apple-system, sans-serif; fill: #8b9cb3; }
      .node-label { font: 600 11px system-ui, -apple-system, sans-serif; fill: #e8edf5; }
      .node-sub { font: 500 9px system-ui, -apple-system, sans-serif; fill: #8b9cb3; }
      .flow {
        fill: none;
        stroke: url(#accent);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 10 8;
        marker-end: url(#arrow);
        animation: dash 2.4s linear infinite;
      }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="960" height="320" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="318" rx="17" fill="none" stroke="rgba(62,232,197,0.18)" stroke-width="1"/>

  <text x="32" y="42" class="title">TalbotIQ PMS</text>
  <text x="32" y="62" class="subtitle">AI does the heavy lifting — every output is a draft, and a human always signs off.</text>

  <!-- HITL flow path -->
  <path class="flow" d="M 108 170 C 148 170, 168 130, 208 130
                         C 248 130, 268 170, 308 170
                         C 348 170, 368 210, 408 210
                         C 448 210, 468 170, 508 170
                         C 548 170, 568 130, 608 130
                         C 648 130, 668 170, 708 170
                         C 748 170, 768 210, 808 210
                         C 848 210, 868 170, 908 170"/>

  <g filter="url(#glow)">
    <g class="pulse" style="animation-delay: 0s">
      <rect x="52" y="148" width="112" height="44" rx="12" fill="#111a28" stroke="#3ee8c5" stroke-width="1.5"/>
      <text x="108" y="168" text-anchor="middle" class="node-label">🎯 Goals &amp; KPIs</text>
      <text x="108" y="182" text-anchor="middle" class="node-sub">weighted → T-score</text>
    </g>
    <g class="pulse" style="animation-delay: 0.3s">
      <rect x="152" y="108" width="112" height="44" rx="12" fill="#111a28" stroke="#3ee8c5" stroke-width="1.5"/>
      <text x="208" y="128" text-anchor="middle" class="node-label">🤖 AI drafts</text>
      <text x="208" y="142" text-anchor="middle" class="node-sub">LLM gateway</text>
    </g>
    <g class="pulse" style="animation-delay: 0.6s">
      <rect x="252" y="148" width="112" height="44" rx="12" fill="#111a28" stroke="#3ee8c5" stroke-width="1.5"/>
      <text x="308" y="168" text-anchor="middle" class="node-label">🧩 Grounded</text>
      <text x="308" y="182" text-anchor="middle" class="node-sub">real evidence only</text>
    </g>
    <g class="pulse" style="animation-delay: 0.9s">
      <rect x="352" y="188" width="112" height="44" rx="12" fill="#111a28" stroke="#5b9dff" stroke-width="1.5"/>
      <text x="408" y="208" text-anchor="middle" class="node-label">🔒 Pending</text>
      <text x="408" y="222" text-anchor="middle" class="node-sub">HITL gate</text>
    </g>
    <g class="pulse" style="animation-delay: 1.2s">
      <rect x="452" y="148" width="112" height="44" rx="12" fill="#111a28" stroke="#5b9dff" stroke-width="1.5"/>
      <text x="508" y="168" text-anchor="middle" class="node-label">🧑 Manager</text>
      <text x="508" y="182" text-anchor="middle" class="node-sub">reviews the draft</text>
    </g>
    <g class="pulse" style="animation-delay: 1.5s">
      <rect x="552" y="108" width="112" height="44" rx="12" fill="#111a28" stroke="#5b9dff" stroke-width="1.5"/>
      <text x="608" y="128" text-anchor="middle" class="node-label">✓ Approve</text>
      <text x="608" y="142" text-anchor="middle" class="node-sub">RBAC + audited</text>
    </g>
    <g class="pulse" style="animation-delay: 1.8s">
      <rect x="652" y="148" width="112" height="44" rx="12" fill="#111a28" stroke="#ffb347" stroke-width="1.5"/>
      <text x="708" y="168" text-anchor="middle" class="node-label">🧾 AuditLog</text>
      <text x="708" y="182" text-anchor="middle" class="node-sub">append-only</text>
    </g>
    <g class="pulse" style="animation-delay: 2.1s">
      <rect x="752" y="188" width="112" height="44" rx="12" fill="#111a28" stroke="#ffb347" stroke-width="1.5"/>
      <text x="808" y="208" text-anchor="middle" class="node-label">🚀 Published</text>
      <text x="808" y="222" text-anchor="middle" class="node-sub">live to the tenant</text>
    </g>
    <g>
      <rect x="860" y="148" width="68" height="44" rx="22" fill="rgba(62,232,197,0.12)" stroke="#3ee8c5" stroke-width="1.5"/>
      <text x="894" y="176" text-anchor="middle" class="node-label">⟳</text>
    </g>
  </g>

  <text x="894" y="248" text-anchor="middle" class="node-sub">next cycle</text>
</svg>
