# Frontend edge: serve the built SPA and reverse-proxy Django-served paths to the
# web tier. Uses Docker's embedded DNS (127.0.0.11) + a variable upstream so the
# `web` service name is re-resolved (survives a web container restart / scaling).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 10m;

    # Anything the Django backend owns → proxy to web:8000.
    location ~ ^/(api|admin|accounts|static|healthz|readyz|metrics)(/|$) {
        set $backend web:8000;
        proxy_pass http://$backend$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    65s;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
