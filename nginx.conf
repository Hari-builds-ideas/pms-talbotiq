# nginx fronting the stateless web tier. With `docker compose up --scale web=N`,
# the compose service name `web` resolves (via Docker's embedded DNS at
# 127.0.0.11) to all replica IPs. Using a *variable* in proxy_pass forces nginx
# to re-resolve `web` per request instead of caching one replica at startup, so
# traffic round-robins across every replica.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;

        location / {
            set $web_upstream web:8000;
            proxy_pass http://$web_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    65s;

            # Surfaces which replica served the request, so round-robin across
            # `--scale web=N` is observable (curl -i ... | grep X-Served-By).
            add_header X-Served-By $upstream_addr always;
        }
    }
}
