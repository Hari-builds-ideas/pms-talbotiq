[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = apps
# --ds has the highest precedence in pytest-django (above the DJANGO_SETTINGS_MODULE
# env var that compose sets to dev), so the suite always runs on test settings.
addopts = -ra --strict-markers --tb=short --ds=config.settings.test -m "not large_tenant and not live_ai"
markers =
    large_tenant: heavy correctness test that seeds ~1k+ employees; deselected by
        default (run explicitly with `-m large_tenant`) so it doesn't slow every run.
    live_ai: hits a REAL LLM (gpt-4o-mini) — costs money + is slow/non-deterministic;
        deselected by default (run explicitly with `-m live_ai`; needs OPENAI_API_KEY).
filterwarnings =
    ignore::DeprecationWarning:allauth.*
