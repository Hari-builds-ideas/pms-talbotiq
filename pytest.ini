[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = apps
# --ds has the highest precedence in pytest-django (above the DJANGO_SETTINGS_MODULE
# env var that compose sets to dev), so the suite always runs on test settings.
addopts = -ra --strict-markers --tb=short --ds=config.settings.test
filterwarnings =
    ignore::DeprecationWarning:allauth.*
